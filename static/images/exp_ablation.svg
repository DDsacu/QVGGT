      <text x="20" y="95">Naive Q</text><text x="180" y="95">-</text><text x="250" y="95">-</text><text x="320" y="95">-</text><text x="430" y="95">54.57</text><text x="620" y="95">0.122</text>
      <text x="20" y="157">+ S</text><text x="180" y="157">on</text><text x="250" y="157">-</text><text x="320" y="157">-</text><text x="430" y="157">80.76</text><text x="620" y="157">0.057</text>
      <text x="20" y="219">+ S + D</text><text x="180" y="219">on</text><text x="250" y="219">on</text><text x="320" y="219">-</text><text x="430" y="219">85.91</text><text x="620" y="219">0.054</text>
    </g>
    <rect x="0" y="250" width="832" height="64" rx="10" fill="#e8f6ef" stroke="#75c08f"/>
