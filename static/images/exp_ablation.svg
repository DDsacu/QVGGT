    <text x="320" y="33" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">T</text>
    <text x="430" y="33" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">CO3Dv2 AUC</text>
    <text x="620" y="33" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">NRGBD Acc</text>
